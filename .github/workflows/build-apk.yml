name: Build Secret Among Us APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Analyze, Test and Build APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Setup Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ------------------------------------------------------------
      # Flutter information
      # ------------------------------------------------------------
      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Generate the Android project
      #
      # The repository contains the Flutter/Dart application,
      # but Android Gradle files are not committed.
      #
      # This creates:
      # android/
      # android/app/
      # android/gradle/
      # AndroidManifest.xml
      # Gradle configuration
      # ------------------------------------------------------------
      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name secret_among_us \
            --org com.secretamongus \
            .

      # ------------------------------------------------------------
      # Get dependencies
      # ------------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # ------------------------------------------------------------
      # Analyze Dart code
      # ------------------------------------------------------------
      - name: Analyze
        run: flutter analyze

      # ------------------------------------------------------------
      # Run tests
      # ------------------------------------------------------------
      - name: Run Flutter tests
        run: flutter test

      # ------------------------------------------------------------
      # Build release APK
      # ------------------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # ------------------------------------------------------------
      # Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecretAmongUs-APK
          path: build/app/outputs/flutter-apk/app-release.apk
