name: Build Secret Among Us APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Analyze, Test and Build APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ------------------------------------------------------------
      # Flutter environment
      # ------------------------------------------------------------
      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Download dependencies
      # ------------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # ------------------------------------------------------------
      # Static analysis
      # ------------------------------------------------------------
      - name: Analyze
        run: flutter analyze

      # ------------------------------------------------------------
      # Run tests
      # ------------------------------------------------------------
      - name: Run Flutter tests
        run: flutter test

      # ------------------------------------------------------------
      # Build release APK
      # ------------------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # ------------------------------------------------------------
      # Verify generated APK
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully generated:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ------------------------------------------------------------
      # Upload APK as GitHub Actions artifact
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecretAmongUs-APK
          path: build/app/outputs/flutter-apk/app-release.apk
